prefix: "&8[&bMistTags&8]&r"

messages:
  no-permission: "{prefix} &cYou don't have permission to do that."
  usage-player: "{prefix} &cUsage: /{label} <player> ..."
  usage-add: "{prefix} &cUsage: /{label} <player> <duration> <tag/anim:id>"
  usage-remove: "{prefix} &cUsage: /{label} <player>"
  usage-preview: "{prefix} &cUsage: /mt preview <tag/anim:id>"
  self-animated-denied: "{prefix} &cYou can't set an animated tag on yourself; ask a staff member."
  self-permanent-denied: "{prefix} &cPermanent prefixes/suffixes are staff-only."
  animation-missing: "{prefix} &cAnimation '{animation}' does not exist."
  cooldown: "{prefix} &cYou can change your own {type} again in {time}."
  invalid-duration: "{prefix} &cInvalid duration. Examples: 30m, 12h, 7d, 1d12h, permanent."
  capped-duration: "{prefix} &eCapped to the maximum duration you're allowed to set yourself: {duration}."
  set-tag: "{prefix} &aSet {type} for {player} &7({expiry})."
  no-active-tag: "{prefix} &e{player} has no active {type}."
  removed-tag: "{prefix} &aRemoved {type} from {player}."
  offline-lookup: "{prefix} &7Player not online, looking up offline profile..."
  unknown-player: "{prefix} &cCould not find any player named '{player}'."
  reload-failed: "{prefix} &cReload failed: {error}"
  reloaded: "{prefix} &aMistTags config.yml, animations.yml, and msg.yml reloaded."
  list-player: "{prefix} &6{player} &7prefix={prefix_value} suffix={suffix_value}"
  list-missing: "{prefix} &eNo stored tag data for {player}."
  list-header: "{prefix} &6Active MistTags"
  list-row: "&e{player} &7prefix={prefix_value} suffix={suffix_value}"
  list-more: "{prefix} &7Showing first {limit}. Use /mt list <player> for details."
  list-empty: "{prefix} &7No active prefixes or suffixes."
  stats:
    - "{prefix} &6MistTags stats"
    - "&eActive prefixes: &f{active_prefixes}"
    - "&eActive suffixes: &f{active_suffixes}"
    - "&eAnimations loaded: &f{animations_loaded}"
    - "&eAnimations running: &f{animations_running}"
    - "&ePlayers using animations: &f{animated_players}"
  preview-console-only: "{prefix} &cOnly players can preview tags."
  preview-started: "{prefix} &aShowing preview for 10 seconds."
  help-title: "&6&lMistTags"
  help-addprefix: "&e/mt addprefix <player> <duration> <tag/anim:id>"
  help-addsuffix: "&e/mt addsuffix <player> <duration> <tag/anim:id>"
  help-removeprefix: "&e/mt removeprefix <player>"
  help-removesuffix: "&e/mt removesuffix <player>"
  help-reload: "&e/mt reload &7- reload config.yml/animations.yml/msg.yml"
  help-list: "&e/mt list [player]"
  help-stats: "&e/mt stats"
  help-preview: "&e/mt preview <tag/anim:id>"
  validation-empty: "{prefix} &cYour prefix/suffix needs some visible text, not just formatting codes."
  validation-too-short: "{prefix} &cThat's too short (minimum {min} visible character{plural})."
  validation-too-long: "{prefix} &cThat's too long (maximum {max} visible characters)."
  validation-banned-word: "{prefix} &cThat contains a word that isn't allowed here."
  validation-banned-pattern: "{prefix} &cThat contains something that isn't allowed here."
